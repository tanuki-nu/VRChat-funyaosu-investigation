<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2択診断システム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
            font-family: sans-serif;
            background-color: #333;
        }

        /* 背景画像を疑似要素で管理 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -1;
            transition: opacity 0.8s ease;
            opacity: 1;
        }

        /* フェード中のクラス */
        body.fade-bg::before {
            opacity: 0;
        }

        .container {
            width: 75vw; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .display-box {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 50px 40px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .main-text {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .choice-card {
            width: 100%;
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            margin: 0 auto 20px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid rgba(0,0,0,0.1);
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .choice-card:hover {
            transform: scale(1.03);
            background-color: #ffffff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .score-output { 
            font-size: 48px; 
            color: #d63031; 
            font-weight: bold; 
            margin: 20px 0; 
        }

        #result-screen { display: none; }

        button.retry-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            background: #333;
            color: #fff;
            transition: opacity 0.2s;
        }
        button.retry-btn:hover { opacity: 0.8; }
    </style>
</head>
<body id="bg-target">

<div class="container">
    <div id="quiz-screen" style="width: 100%;">
        <div class="display-box">
            <div id="question-label" class="main-text">読み込み中...</div>
        </div>
        <div id="choices-list" style="width: 100%; margin-top: 30px; display: flex; flex-direction: column; align-items: center;">
            </div>
    </div>

    <div id="result-screen" class="display-box">
        <div id="final-percent" class="score-output"></div>
        <div id="rank-label" class="main-text"></div>
        <button class="retry-btn" onclick="location.reload()">最初からやり直す</button>
    </div>
</div>

<script>
    let questions = [];
    let rankData = [];
    let currentIdx = 0;
    let score = 0;
    let maxScore = 0;

    const bgLinks = [
        'https://drive.google.com/thumbnail?id=1Ez4KCt_m2nIvrdVpDUNDcmbcmA7s42BQ&sz=w1920',
        'https://drive.google.com/thumbnail?id=13IL8wole1_8Lzmme9CRYNni6VcokIDBe&sz=w1920',
        'https://drive.google.com/thumbnail?id=1MuJ15v1JfyhEi4BZgZlg9aDtE7nd48ML&sz=w1920'
    ];

    async function init() {
        try {
            // タイムスタンプを付けてキャッシュを回避
            const response = await fetch('diagnosis_qap.txt?t=' + new Date().getTime());
            const raw = await response.text();
            parseFile(raw);
            render();
        } catch (e) {
            document.getElementById('question-label').innerText = "diagnosis_qap.txtを読み込めませんでした。";
            console.error(e);
        }
    }

    function parseFile(content) {
        const lines = content.split('\n');
        let mode = 'quiz';
        lines.forEach(line => {
            const t = line.trim();
            if (!t) return;
            if (t === '[RESULTS]') { mode = 'rank'; return; }

            if (mode === 'quiz') {
                if (t.startsWith('^')) {
                    questions.push({ q: t.replace(/\^/g, ''), options: [] });
                } else if (t.startsWith('-')) {
                    const inner = t.substring(1, t.length - 1);
                    const pairs = inner.split(',');
                    let qMax = 0;
                    pairs.forEach(p => {
                        const [txt, val] = p.split(':').map(s => s.trim().replace(/"/g, ''));
                        const points = parseInt(val);
                        questions[questions.length - 1].options.push({ txt, points });
                        if (points > qMax) qMax = points;
                    });
                    maxScore += qMax;
                }
            } else {
                // point:ラベル<閾値><#HEX>
                const items = t.split(',');
                items.forEach((item) => {
                    const match = item.match(/point:(.+)<(\d+)><#([0-9A-Fa-f]{6})>/);
                    if (match) {
                        const label = match[1].trim();
                        const threshold = parseInt(match[2]);
                        const color = '#' + match[3];
                        rankData.push({ threshold: threshold, label: label, color: color });
                    }
                });
            }
        });
        rankData.sort((a, b) => b.threshold - a.threshold);
    }

    function updateBackground(ratio) {
        let url = "";
        if (ratio < 0.33) url = bgLinks[0];
        else if (ratio < 0.66) url = bgLinks[1];
        else url = bgLinks[2];
        
        // フェード効果を追加
        const bgElement = document.getElementById('bg-target');
        bgElement.classList.add('fade-bg');
        
        setTimeout(() => {
            bgElement.style.backgroundImage = `url('${url}')`;
            bgElement.classList.remove('fade-bg');
        }, 400);
    }

    function render() {
        if (questions.length === 0) return;
        
        // 現在の進捗率に基づいて背景を更新
        const progressRatio = currentIdx / questions.length;
        updateBackground(progressRatio);
        
        const data = questions[currentIdx];
        document.getElementById('question-label').innerText = data.q;
        const list = document.getElementById('choices-list');
        list.innerHTML = '';

        data.options.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'choice-card';
            div.innerText = opt.txt;
            div.onclick = () => next(opt.points);
            list.appendChild(div);
        });
    }

    function next(p) {
        score += p;
        currentIdx++;
        if (currentIdx < questions.length) {
            render();
        } else {
            finish();
        }
    }

    function finish() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const ratio = maxScore > 0 ? score / maxScore : 0;
        const percent = Math.round(ratio * 100);

        // 結果画面では常に3枚目を表示（最終スコアに基づいて）
        updateBackground(ratio);

        let finalRank = "";
        for (let r of rankData) {
            if (percent >= r.threshold) {
                finalRank = r.label;
                break;
            }
        }

        document.getElementById('final-percent').innerText = `test度: ${percent}%`;
        document.getElementById('rank-label').innerText = finalRank;
    }

    window.onload = init;
</script>

</body>
</html>
