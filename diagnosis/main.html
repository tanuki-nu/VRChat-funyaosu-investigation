<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2択診断システム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            /* 枠を画面の中央（上下）に配置 */
            align-items: center; 
            font-family: sans-serif;
            transition: background-image 0.5s ease;
            background-color: #333; /* 画像読み込みまでの予備色 */
        }

        .container {
            /* 画面の4分の3（75%）の大きさに設定 */
            width: 75vw; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .display-box {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 50px 40px; /* 少し余白を広げました */
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .main-text {
            font-size: 28px; /* 少し文字を大きくしました */
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .choice-card {
            width: 100%; /* 枠いっぱいに広げる */
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            margin: 0 auto 20px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid rgba(0,0,0,0.1);
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .choice-card:hover {
            transform: scale(1.03);
            background-color: #ffffff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .score-output { 
            font-size: 48px; 
            color: #d63031; 
            font-weight: bold; 
            margin: 20px 0; 
        }

        #result-screen { display: none; }

        button.retry-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            background: #333;
            color: #fff;
            transition: opacity 0.2s;
        }
        button.retry-btn:hover { opacity: 0.8; }
    </style>
</head>
<body id="bg-target">

<div class="container">
    <div id="quiz-screen" style="width: 100%;">
        <div class="display-box">
            <div id="question-label" class="main-text">読み込み中...</div>
        </div>
        <div id="choices-list" style="width: 100%; margin-top: 30px; display: flex; flex-direction: column; align-items: center;">
            </div>
    </div>

    <div id="result-screen" class="display-box">
        <div id="final-percent" class="score-output"></div>
        <div id="rank-label" class="main-text"></div>
        <button class="retry-btn" onclick="location.reload()">最初からやり直す</button>
    </div>
</div>

<script>
    let questions = [];
    let rankData = [];
    let currentIdx = 0;
    let score = 0;
    let maxScore = 0;

    // Google Driveの直リンク形式に変換したリスト
    const bgLinks = [
        'https://lh3.googleusercontent.com/d/Ez4KCt_m2nIvrdVpDUNDcmbcmA7s42BQ',
        'https://lh3.googleusercontent.com/d/13IL8wole1_8Lzmme9CRYNni6VcokIDBe',
        'https://lh3.googleusercontent.com/d/1MuJ15v1JfyhEi4BZgZlg9aDtE7nd48ML'
    ];

    async function init() {
        try {
            const response = await fetch('diagnosis_qap.txt');
            const raw = await response.text();
            parseFile(raw);
            updateBackground(0); // 最初の背景セット
            render();
        } catch (e) {
            document.getElementById('question-label').innerText = "diagnosis_qap.txtを読み込めませんでした。";
            console.error(e);
        }
    }

    function parseFile(content) {
        const lines = content.split('\n');
        let mode = 'quiz';
        lines.forEach(line => {
            const t = line.trim();
            if (!t) return;
            if (t === '[RESULTS]') { mode = 'rank'; return; }

            if (mode === 'quiz') {
                if (t.startsWith('^')) {
                    questions.push({ q: t.replace(/\^/g, ''), options: [] });
                } else if (t.startsWith('-')) {
                    const inner = t.substring(1, t.length - 1);
                    const pairs = inner.split(',');
                    let qMax = 0;
                    pairs.forEach(p => {
                        const [txt, val] = p.split(':').map(s => s.trim().replace(/"/g, ''));
                        const points = parseInt(val);
                        questions[questions.length - 1].options.push({ txt, points });
                        if (points > qMax) qMax = points;
                    });
                    maxScore += qMax;
                }
            } else {
                const [threshold, label] = t.split(':');
                rankData.push({ threshold: parseInt(threshold), label: label.trim() });
            }
        });
        rankData.sort((a, b) => b.threshold - a.threshold);
    }

    function updateBackground(ratio) {
        let url = "";
        if (ratio <= 0.33) url = bgLinks[0];
        else if (ratio <= 0.66) url = bgLinks[1];
        else url = bgLinks[2];
        
        document.getElementById('bg-target').style.backgroundImage = `url('${url}')`;
    }

    function render() {
        if (questions.length === 0) return;
        const data = questions[currentIdx];
        document.getElementById('question-label').innerText = data.q;
        const list = document.getElementById('choices-list');
        list.innerHTML = '';

        data.options.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'choice-card';
            div.innerText = opt.txt;
            div.onclick = () => next(opt.points);
            list.appendChild(div);
        });
    }

    function next(p) {
        score += p;
        currentIdx++;
        if (currentIdx < questions.length) {
            render();
        } else {
            finish();
        }
    }

    function finish() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const ratio = maxScore > 0 ? score / maxScore : 0;
        const percent = Math.round(ratio * 100);

        // スコア比率に基づき背景を最終更新
        updateBackground(ratio);

        let finalRank = "";
        for (let r of rankData) {
            if (percent >= r.threshold) {
                finalRank = r.label;
                break;
            }
        }

        document.getElementById('final-percent').innerText = `test度: ${percent}%`;
        // ハイフンのない素のテキストを表示
        document.getElementById('rank-label').innerText = finalRank;
    }

    window.onload = init;
</script>

</body>
</html>
